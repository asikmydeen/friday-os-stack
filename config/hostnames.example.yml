# Example only — no real hostnames. Copy and edit to config/hostnames.yml.
#
# Maps a logical name to the container/service each request should reach.
# This is consumed by the gateway container; nothing here is wired up yet.
#
# The Board is the only core service a hostname may target. Friday has no
# host port, so the friday sample below is the Board's chat route.

friday:
  service: board
  port: 8080

board:
  service: board
  port: 8080

jellyfin:
  service: jellyfin
  port: 8096
