# EXPERIMENTAL — wire draft, not rendered or tested against a real image yet.
# Optional add-on that attaches to Radarr/Sonarr for subtitle fetching.
# Not part of the base "Movies and TV" bundle; installed separately.

id: bazarr
category: media-management

storage:
  - { volume: library, sub: movies, mount: /movies, read_only: true }
  - { volume: library, sub: tv, mount: /tv, read_only: true }
  - { volume: bazarr_config, mount: /config }

ports:
  - { host: 127.0.0.1:6767, container: 6767 }

wires:
  health: { url: http://bazarr:6767/ping, via: executor on the apps network }
  secrets: [BAZARR_URL, BAZARR_API_KEY]
  agents: [fetcher]
  attaches_to: [radarr, sonarr]
