# EXPERIMENTAL — wire draft, not rendered or tested against a real image yet.
# Alternative player in the "Movies and TV" bundle (docs/apps.md).
# The bundle installs this app only when the operator chose Plex.
# conflicts_primary_with names the other choice; it is not installed alongside.

id: plex
category: media-server
conflicts_primary_with: [jellyfin]

storage:
  - { volume: library, sub: movies, mount: /data/movies, read_only: true }
  - { volume: library, sub: tv, mount: /data/tv, read_only: true }
  - { volume: plex_config, mount: /config }

ports:
  - { host: 127.0.0.1:32400, container: 32400 }

questions:
  # Asked only when the Movies and TV bundle chose Plex. A Jellyfin install
  # does not include this app and does not ask for a claim token.
  - { id: claim_token, kind: secret, when: chosen_player }

wires:
  health: { url: http://plex:32400/identity, via: executor on the apps network }
  secrets: [PLEX_CLAIM_TOKEN, PLEX_SERVER_TOKEN]
  agents: [media]
