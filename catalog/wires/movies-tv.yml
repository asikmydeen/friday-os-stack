# EXPERIMENTAL — bundle draft. guests/bundle.py records this plan and does not apply it.
# Not rendered against a real image. Catalog install stays closed.
# The "Movies and TV" bundle described in docs/apps.md. The operator answers
# one question, Jellyfin or Plex. Only that player is installed. The other
# is left out, and Plex's claim token is asked only when Plex was chosen.

id: movies-tv
kind: bundle
question:
  id: player
  choices: [jellyfin, plex]
  default: jellyfin  # Jellyfin's API key is minted locally.
                      # Choosing Plex asks for the claim token on plex.yml.
  installs: chosen_only

apps:
  always: [qbittorrent, prowlarr, radarr, sonarr]
  one_of: player

wiring:
  # Applied by the executor as one approved operation, in this order.
  # qBittorrent has a username and password, not an API key.
  - generate_api_keys: [radarr, sonarr, prowlarr]
  - generate_credentials: { qbittorrent: [QBITTORRENT_USER, QBITTORRENT_PASSWORD] }
  - point: { radarr: qbittorrent, category: radarr }
  - point: { sonarr: qbittorrent, category: sonarr }
  - point: { prowlarr: [radarr, sonarr], full_sync: true }
  - quality_profile_order: worst-first
  - register_webhook: { radarr: http://webhooks:8080/arr, sonarr: http://webhooks:8080/arr }
  - point_player_at: [library/movies, library/tv]
  - grant_tools: { fetcher: [radarr, sonarr, prowlarr, qbittorrent], media: [player] }
  - add_health_probes: true
  - bind_uis: 127.0.0.1  # a public name is a separate, later confirmation
                          # under docs/cloudflare.md
