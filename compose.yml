# The core images build from this repository. They are not published.
# v0.0.1 does not contain them. Empty secrets make friday, board,
# memory-mcp, and executor exit. See README.md "Build order".

name: friday-os-stack

x-common: &common
  restart: unless-stopped
  networks: [core]

services:
  # --- profile: core ---
  qdrant:
    <<: *common
    image: qdrant/qdrant:latest
    profiles: [core, chat]
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    <<: *common
    image: ollama/ollama:latest
    profiles: [core, chat]
    volumes:
      - ollama_data:/root/.ollama

  postgres:
    <<: *common
    image: postgres:16-alpine
    profiles: [core, chat]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/memories.sql:/docker-entrypoint-initdb.d/memories.sql:ro

  memory-mcp:
    <<: *common
    restart: "no"
    image: friday-os-stack/memory-mcp:0.1.0
    build:
      context: .
      dockerfile: memoryd/Dockerfile
    profiles: [core, chat]
    environment:
      MEMORY_TOKEN: ${MEMORY_TOKEN}
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BIND_HOST: 0.0.0.0
      PORT: "8080"
    depends_on: [postgres, qdrant, ollama]

  executor:
    <<: *common
    restart: "no"
    image: friday-os-stack/executor:0.1.0
    build:
      context: .
      dockerfile: executor/Dockerfile
    profiles: [core, chat]
    environment:
      BOARD_APPROVAL_TOKEN: ${BOARD_APPROVAL_TOKEN}
      FRIDAY_NOTIFY_TOKEN: ${FRIDAY_NOTIFY_TOKEN}
      STORE_PATH: /data/gate.json
      BIND_HOST: 0.0.0.0
      PORT: "8080"
    volumes:
      - executor_data:/data

  # --- profile: chat ---
  friday:
    <<: *common
    restart: "no"
    image: friday-os-stack/friday:0.1.0
    build:
      context: .
      dockerfile: friday/Dockerfile
    profiles: [chat]
    environment:
      FRIDAY_NOTIFY_TOKEN: ${FRIDAY_NOTIFY_TOKEN}
      MEMORY_TOKEN: ${MEMORY_TOKEN}
      MEMORY_URL: http://memory-mcp:8080
      EXECUTOR_URL: http://executor:8080
      MODEL_API_KEY: ${MODEL_API_KEY}
      MODEL_BASE_URL: ${MODEL_BASE_URL}
      MODEL_FAST: ${MODEL_FAST}
      MODEL_THINK: ${MODEL_THINK}
      OLLAMA_URL: http://ollama:11434
      BIND_HOST: 0.0.0.0
      PORT: "8080"
    depends_on: [memory-mcp, executor, ollama]
    volumes:
      - friday_data:/data
      - ./soul:/soul:ro
      - ./charters:/soul/agents:ro

  board:
    <<: *common
    restart: "no"
    image: friday-os-stack/board:0.1.0
    build:
      context: .
      dockerfile: board/Dockerfile
    profiles: [chat]
    environment:
      BOARD_PASSWORD: ${BOARD_PASSWORD}
      FRIDAY_NOTIFY_TOKEN: ${FRIDAY_NOTIFY_TOKEN}
      BOARD_APPROVAL_TOKEN: ${BOARD_APPROVAL_TOKEN}
      FRIDAY_URL: http://friday:8080
      EXECUTOR_URL: http://executor:8080
      BIND_HOST: 0.0.0.0
      PORT: "8080"
    depends_on: [friday]
    ports:
      - "127.0.0.1:8080:8080"

  # --- profile: code (optional) ---
  # Taskrunner against an external Coder. Not included in the first image.

  # --- profile: edge (optional) ---
  # Cloudflare tunnel. Off unless CLOUDFLARE_ENABLED=1.

  # --- profile: mesh (optional) ---
  # Headscale. Off unless HEADSCALE_ENABLED=1.
  # The phone and the laptop join as peers. They do not join this network.

  # The task journal is the executor's record. A messaging door, the MCP
  # listener, and the browser session are decisions in this repo and have
  # no service here. Catalog apps stay guests.

networks:
  core:

volumes:
  qdrant_data:
  ollama_data:
  postgres_data:
  friday_data:
  executor_data:
